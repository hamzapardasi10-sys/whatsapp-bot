name: Daily WhatsApp Calendar

on:
  schedule:
    - cron: '0 3 * * *'  # Har roz subah is waqt chalega
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install hijri-converter

    - name: Run bot script
      run: |
        python bot.py
