name: Send Daily WhatsApp Message

on:
  schedule:
    - cron: '0 1 * * *' # UTC وقت کے مطابق (پاکستانی وقت صبح 6:00 بجے کے مطابق سیٹ ہے)
  workflow_dispatch: # آپ اسے GitHub سے خود بھی بٹن دبا کر ٹیسٹ کر سکتے ہیں

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Bot Script
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_BUSINESS_ACCOUNT_ID: ${{ secrets.WHATSAPP_BUSINESS_ACCOUNT_ID }}
        run: python bot.py
